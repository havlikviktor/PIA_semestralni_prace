services:
  db:
    image: postgres:15
    container_name: pia_postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - sem-network

  backend:
    build:
      context: ./backend
    container_name: pia_backend
    env_file:
      - .env
    command: npm run start:dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks:
      - sem-network
    
  frontend:
    build:
      context: ./frontend
    container_name: pia_frontend
    env_file:
      - .env
    command: npm run dev
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
    - "${FRONTEND_PORT}:3000"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - sem-network

volumes:
  db-data:

networks:
  sem-network:
