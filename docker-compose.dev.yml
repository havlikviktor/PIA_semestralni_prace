services:
  db-dev:
    image: postgres:15
    container_name: pia_postgres_dev
    env_file:
      - .env
      - .env.backend.dev
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - pia-network-dev

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pia_backend_dev
    env_file:
      - .env
      - .env.backend.dev
    command: npm run start:dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ./.env.backend.dev:/usr/src/app/.env
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      - db-dev
    environment:
      - MAIL_HOST=mailhog-dev
      - POSTGRES_HOST=db-dev
    networks:
      - pia-network-dev

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pia_frontend_dev
    env_file:
      - .env
      - .env.frontend.dev
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - ./frontend/.env.frontend.dev:/usr/src/app/.env
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend-dev
    networks:
      - pia-network-dev

  mailhog-dev:
    image: mailhog/mailhog:latest
    container_name: pia_mailhog_dev
    ports:
      - "${MAIL_PORT}:1025" # SMTP server
      - "${UI_PORT}:8025" # Web UI
    networks:
      - pia-network-dev

volumes:
  db-data:

networks:
  pia-network-dev:
    driver: bridge
